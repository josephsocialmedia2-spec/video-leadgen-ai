name: F1 REAL AVATAR TEST

on:
  push:
    branches: [main]
    paths:
      - 'trigger-real-avatar.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Sofia image
        run: |
          mkdir -p work
          base64 -d assets/sofia_avatar.b64 > work/sofia.jpg
          file work/sofia.jpg
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git wget
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install neural Italian TTS
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
      - name: Create natural Italian speech
        run: |
          edge-tts --voice it-IT-IsabellaNeural --rate='+2%' --text "Stai pensando di vendere casa? Il valore giusto non nasce da una stima a caso. Serve conoscere il mercato, la zona e come presentare l'immobile. F1 Immobiliare costruisce una strategia prima di pubblicare l'annuncio." --write-media work/voice.mp3
      - name: Install SadTalker
        run: |
          git clone --depth 1 https://github.com/OpenTalker/SadTalker.git work/SadTalker
          pip install torch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r work/SadTalker/requirements.txt
      - name: Download SadTalker models
        run: |
          cd work/SadTalker
          bash scripts/download_models.sh
      - name: Render talking Sofia
        run: |
          mkdir -p work/output
          cd work/SadTalker
          python inference.py --driven_audio ../voice.mp3 --source_image ../sofia.jpg --result_dir ../output --still --preprocess full --size 256 --cpu
          cd ../..
          FILE=$(find work/output -maxdepth 1 -name '*.mp4' | head -n 1)
          test -n "$FILE"
          ffmpeg -y -i "$FILE" -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black" -c:v libx264 -preset veryfast -crf 25 -c:a aac -b:a 128k -t 30 F1_SOFIA_TEST.mp4
      - name: Upload real MP4
        uses: actions/upload-artifact@v4
        with:
          name: F1_SOFIA_REAL_VIDEO
          path: F1_SOFIA_TEST.mp4
          retention-days: 1

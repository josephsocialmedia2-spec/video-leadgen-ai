name: F1 AVATAR ALT ENDPOINTS

on:
  workflow_dispatch:
  push:
    paths:
      - 'triggers/avatar-alt.txt'

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: longcat_alt
            space: victor/LongCat-Video-Avatar-1.5
          - model: infinitetalk_alt
            space: ShalomKing/infinitetalk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q gradio_client edge-tts requests
      - name: Inputs
        run: |
          base64 -d assets/sofia_avatar.b64 > sofia.png
          edge-tts --voice it-IT-IsabellaNeural --rate=+4% --text "Quanto vale davvero casa tua oggi?" --write-media test.mp3
          mkdir -p result
      - name: Generate via discovered API
        env:
          MODEL: ${{ matrix.model }}
          SPACE: ${{ matrix.space }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,requests,shutil,traceback
          from gradio_client import Client, handle_file
          model=os.environ['MODEL']; space=os.environ['SPACE']; token=os.environ.get('HF_TOKEN') or None
          report={'model':model,'space':space,'status':'started'}
          def save(x,path):
              if isinstance(x,str):
                  if x.startswith('http'):
                      r=requests.get(x,timeout=300); r.raise_for_status(); open(path,'wb').write(r.content); return True
                  if os.path.exists(x): shutil.copy2(x,path); return True
              if isinstance(x,dict):
                  for k in ('path','url','video','value'):
                      if k in x:
                          try:
                              if save(x[k],path): return True
                          except: pass
              if isinstance(x,(list,tuple)):
                  for v in x:
                      try:
                          if save(v,path): return True
                      except: pass
              return False
          try:
              c=Client(space,token=token)
              api=c.view_api(return_format='dict')
              open(f'result/{model}_api.json','w').write(json.dumps(api,indent=2,default=str))
              eps=api.get('named_endpoints',{})
              cand=[]
              for ep,s in eps.items():
                  ps=s.get('parameters',[]) or []; names=[str(p.get('parameter_name','')).lower() for p in ps]
                  if any('audio' in n for n in names) and any(any(k in n for k in ('image','photo','avatar','reference','source')) for n in names): cand.append((ep,s))
              report['endpoints']=[x[0] for x in cand]
              if not cand: raise RuntimeError('No image+audio API endpoint')
              for ep,s in cand[:4]:
                  kw={}
                  for p in s.get('parameters',[]) or []:
                      n=str(p.get('parameter_name','')); nl=n.lower()
                      if any(k in nl for k in ('image','photo','avatar','reference','source')): kw[n]=handle_file('sofia.png')
                      elif 'audio' in nl: kw[n]=handle_file('test.mp3')
                      elif 'prompt' in nl or nl=='text': kw[n]='A realistic Italian real estate consultant speaking naturally to camera in a bright modern apartment, stable identity, natural upper body and hand motion.'
                      elif p.get('parameter_has_default',False): continue
                      elif 'resolution' in nl: kw[n]='480p'
                      elif 'seed' in nl: kw[n]=42
                      else:
                          t=str(p.get('python_type',{})).lower()
                          if 'bool' in t: kw[n]=False
                          elif 'int' in t: kw[n]=1
                          elif 'float' in t: kw[n]=1.0
                          else: kw[n]=''
                  try:
                      report['attempt']=ep; report['keys']=list(kw)
                      res=c.predict(api_name=ep,**kw); report['raw']=str(res)[:2000]
                      if save(res,f'result/{model}.mp4'):
                          report['status']='video_created'; break
                  except Exception as e:
                      report.setdefault('errors',[]).append(f'{ep}: {type(e).__name__}: {e}')
              if report.get('status')!='video_created': raise RuntimeError('No endpoint produced video')
          except Exception as e:
              report['status']='failed'; report['error']=f'{type(e).__name__}: {e}'; report['traceback']=traceback.format_exc()[-4000:]
          open(f'result/{model}_report.json','w').write(json.dumps(report,indent=2,ensure_ascii=False))
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alt-${{ matrix.model }}
          path: result/
          retention-days: 1
